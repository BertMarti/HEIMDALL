name: heimdall

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: heimdall-wg
    restart: unless-stopped
    environment:
      # Solo se aplican en el primer arranque (después se gestiona todo desde la web)
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USER:-admin}
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD:?Falta WG_ADMIN_PASSWORD en .env}
      INIT_HOST: ${WG_HOST:?Falta WG_HOST en .env}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: ${WG_DNS:-1.1.1.1}
      DISABLE_IPV6: "true"
    volumes:
      - ./data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - heimdall

  caddy:
    image: caddy:2-alpine
    container_name: heimdall-caddy
    restart: unless-stopped
    depends_on:
      - wg-easy
    environment:
      LAN_IP: ${LAN_IP:?Falta LAN_IP en .env}
      PI_HOSTNAME: ${PI_HOSTNAME:-raspberrypi}
      WEB_PORT: ${WEB_PORT:-51843}
    ports:
      - "${WEB_PORT:-51843}:${WEB_PORT:-51843}/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    networks:
      - heimdall

  # DNS dinámico gratuito (opcional): se activa con `docker compose --profile ddns up -d`
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: heimdall-duckdns
    restart: unless-stopped
    profiles: ["ddns"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
    volumes:
      - ./data/duckdns:/config

networks:
  heimdall:
    name: heimdall
